services:
  frontend:
    build:
      context: .
      # host — на сервере множество параллельных соединений npm ci (630+
      # пакетов разом) через Docker bridge-сеть виснет/падает ("Exit handler
      # never called!"); через host-сеть тот же npm ci проходит за 18с.
      # Влияет только на сборку образа, не на сеть уже запущенного контейнера
      # (та осталась внешней `backend` ниже).
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://helper.savt.by}
    image: savt-assist-frontend
    container_name: savt-assist-frontend
    restart: unless-stopped
    ports:
      # Слушаем только на localhost — наружу отдаёт nginx через reverse proxy.
      - "3000:3000"
    networks:
      - backend

networks:
  backend:
    # Та же docker-сеть, что и у бэкенда/nginx, чтобы nginx мог достучаться
    # до контейнера по имени (savt-assist-frontend:3000). Имя сети — из
    # `docker network ls` на сервере (обычно `<compose-проект>_default`).
    external: true
    name: ${BACKEND_NETWORK:-savt-backend_default}
